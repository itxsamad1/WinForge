<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinForge</title>
  <style>
    :root {
      --bg: #07090e;
      --text: #eef2f9;
      --dim: #9aa4b8;
      --accent: #3d9bff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Outfit", sans-serif;
      overflow: hidden;
    }
    .shell {
      min-height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 420px at 12% -8%, rgba(0, 120, 255, 0.28), transparent 58%),
        radial-gradient(700px 380px at 90% 8%, rgba(61, 155, 255, 0.14), transparent 55%),
        var(--bg);
      -webkit-app-region: drag;
    }
    .card {
      text-align: center;
      padding: 28px 36px;
      max-width: 420px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #1a6dff, #3d9bff 55%, #7ec0ff);
      box-shadow: 0 18px 40px rgba(0, 100, 255, 0.35);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.04em;
      animation: pulse 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: var(--dim);
      font-size: 14px;
      line-height: 1.5;
    }
    .bar {
      margin: 22px auto 0;
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0078ff, #7ec0ff);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="mark">W</div>
      <h1>WinForge</h1>
      <p>Starting local installer engine…</p>
      <div class="bar"><span></span></div>
    </div>
  </div>
</body>
</html>
